<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stitching Unit — Interactive 3D</title>
    <style>
      html, body { height: 100%; }
      body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial; }
      #app { position: fixed; inset: 0; }
      .label { position: fixed; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.6); padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(148, 163, 184, 0.25); backdrop-filter: blur(6px); }
      .label a { color: #93c5fd; text-decoration: none; }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  </head>
  <body>
    <div class="label">Stitching Unit Wage Calculator — Interactive 3D demo. Drag to orbit. Scroll to zoom.</div>
    <div id="app"></div>
    <script>
      const app = document.getElementById('app');

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x0f172a, 60, 160);

      const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 35, 90);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x0f172a, 1);
      app.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 10, 0);
      controls.enableDamping = true;

      // lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(20, 40, 30);
      scene.add(dir);

      // floor
      const floorGeom = new THREE.PlaneGeometry(400, 200, 1, 1);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 1, metalness: 0 });
      const floor = new THREE.Mesh(floorGeom, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      scene.add(floor);

      // helper: gradient backdrop plane
      const gradGeom = new THREE.PlaneGeometry(400, 160);
      const gradMat = new THREE.MeshBasicMaterial({ color: 0x1f2937, transparent: true, opacity: 0.6 });
      const grad = new THREE.Mesh(gradGeom, gradMat);
      grad.position.set(0, 40, -80);
      scene.add(grad);

      // materials
      const workerMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0 });
      const fabricMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
      const machineMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.2, roughness: 0.6 });
      const deskMat = new THREE.MeshStandardMaterial({ color: 0x1f2937 });

      // create a sewing station (desk + machine + worker)
      function createStation(x, z, hueOffset = 0) {
        const group = new THREE.Group();
        group.position.set(x, 0, z);

        // desk
        const desk = new THREE.Mesh(new THREE.BoxGeometry(24, 1, 10), deskMat);
        desk.position.set(0, 9, 0);
        group.add(desk);

        // machine
        const machine = new THREE.Mesh(new THREE.BoxGeometry(16, 4, 6), machineMat);
        machine.position.set(-4, 12, 0);
        group.add(machine);
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 1, 16), new THREE.MeshStandardMaterial({ color: 0xcbd5e1 }));
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(-10, 12, 0);
        group.add(wheel);

        // worker
        const head = new THREE.Mesh(new THREE.SphereGeometry(2.6, 24, 16), workerMat);
        head.position.set(8, 15.5, 0);
        group.add(head);
        const torso = new THREE.Mesh(new THREE.BoxGeometry(5, 6, 4), fabricMat);
        torso.position.set(8, 11.5, 0);
        group.add(torso);

        // thread as a tube following a bezier curve
        const p0 = new THREE.Vector3(-2, 13, 0);
        const p1 = new THREE.Vector3(2, 18, 0);
        const p2 = new THREE.Vector3(6, 14, 0);
        const curve = new THREE.CatmullRomCurve3([p0, p1, p2], false, 'centripetal');
        const tubeGeom = new THREE.TubeGeometry(curve, 20, 0.08, 8, false);
        const tubeMat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.6 + hueOffset, 0.8, 0.6), emissive: 0x1e3a8a, emissiveIntensity: 0.08 });
        const thread = new THREE.Mesh(tubeGeom, tubeMat);
        group.add(thread);

        // animate head bob + wheel spin + thread wave
        group.userData = { head, wheel, curve, thread, t: Math.random() * Math.PI * 2 };
        return group;
      }

      const stations = [];
      const positions = [ -60, 0, 60 ];
      positions.forEach((x, i) => {
        const st = createStation(x, 0, i * 0.15);
        scene.add(st);
        stations.push(st);
      });

      // subtle accent lines (threads across the floor)
      const threadMat = new THREE.LineBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.4 });
      for (let i = -2; i <= 2; i++) {
        const pts = [];
        for (let x = -80; x <= 80; x += 8) {
          pts.push(new THREE.Vector3(x, 0.05, i * 12 + Math.sin(x * 0.05) * 2));
        }
        const geom = new THREE.BufferGeometry().setFromPoints(pts);
        const line = new THREE.Line(geom, threadMat);
        scene.add(line);
      }

      // animate
      const clock = new THREE.Clock();
      function animate() {
        const elapsed = clock.getElapsedTime();
        stations.forEach((st, idx) => {
          const { head, wheel, curve, thread } = st.userData;
          head.position.y = 15.5 + Math.sin(elapsed * 2 + idx) * 0.6;
          wheel.rotation.x += 0.08 + idx * 0.01;

          // update thread curve gently
          const pnts = curve.getPoints(20);
          for (let i = 0; i < pnts.length; i++) {
            const p = pnts[i];
            p.y += Math.sin(elapsed * 2 + i * 0.5 + idx) * 0.01;
          }
          thread.geometry.dispose();
          thread.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pnts, false, 'centripetal'), 20, 0.08, 8, false);
        });

        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
  </html>
