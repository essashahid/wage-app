<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tailor Beard Logo</title>
  <desc id="desc">A minimalist tailor face logo with hair, beard, and a sewing needle with thread.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="128" cy="128" r="120" fill="url(#ring)" opacity="0.15"/>
  <circle cx="128" cy="128" r="108" fill="#FFFFFF"/>

  <!-- Hair -->
  <path d="M60 110c2-34 28-58 68-58s66 24 68 58c-10-10-26-18-48-18-14 0-26 3-38 8-18 7-33 5-50 10z" fill="#2B2A2E"/>

  <!-- Face -->
  <ellipse cx="128" cy="135" rx="54" ry="48" fill="#F4C7A1"/>

  <!-- Ears -->
  <ellipse cx="74" cy="135" rx="9" ry="14" fill="#F0B993"/>
  <ellipse cx="182" cy="135" rx="9" ry="14" fill="#F0B993"/>

  <!-- Eyes -->
  <circle cx="108" cy="132" r="6.5" fill="#2B2A2E"/>
  <circle cx="148" cy="132" r="6.5" fill="#2B2A2E"/>
  <circle cx="106.5" cy="130.5" r="1.8" fill="#FFFFFF"/>
  <circle cx="146.5" cy="130.5" r="1.8" fill="#FFFFFF"/>

  <!-- Moustache -->
  <path d="M92 150c9-6 18-6 28 0 10-6 19-6 28 0-8 3-18 5-28 5s-20-2-28-5z" fill="#2B2A2E"/>

  <!-- Beard -->
  <path d="M84 150c6 22 22 36 44 36s38-14 44-36c-10 8-27 12-44 12s-34-4-44-12z" fill="#1F1D22"/>

  <!-- Needle and thread -->
  <g transform="translate(150,184) rotate(-20)">
    <rect x="0" y="-1.2" width="48" height="2.4" rx="1.2" fill="#2B2A2E"/>
    <circle cx="2.4" cy="0" r="1.6" fill="#6C63FF"/>
    <path d="M48 0c10 0 14 6 14 12s-4 12-12 12" fill="none" stroke="#00C2FF" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Subtle shadow under chin -->
  <ellipse cx="128" cy="198" rx="36" ry="6" fill="#000000" opacity="0.05"/>
</svg>


